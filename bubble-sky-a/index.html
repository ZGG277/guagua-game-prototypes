<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152c3b"><title>泡泡上云端 · Bubble Sky</title><link rel="stylesheet" href="style.css"></head><body><main id="stage"><canvas id="game" aria-label="泡泡上云端：按住吹大，松手放飞；按住底部左右拖动扇子，穿过彩虹圈收集小彩虹，避开两侧和小鸟" tabindex="0"></canvas><header><div class="counter"><span class="rainbow-icon" aria-label="收集彩虹">🌈</span><strong id="score">0</strong></div><span id="best" hidden></span><button id="settings" aria-label="打开设置">☷</button></header><div id="hint">按住，吹一个泡泡<span>松手放飞 · 穿彩虹圈上云端</span></div><div id="height">0 m</div><div id="readout" aria-live="polite"></div><div id="result" hidden><strong id="final">🌈 0</strong><p id="breakdown">飞行 0 米</p><button id="again">再吹一个</button></div><div id="paused" hidden><button id="resume">轻点继续</button></div><dialog id="panel"><form method="dialog"><button class="close" aria-label="关闭设置">×</button><h2>轻一点，飞久一点</h2><label><span>轻音效</span><input id="sound" type="checkbox" checked></label><label><span>麦克风吹气 <small>可选</small></span><input id="mic" type="checkbox"></label><p id="micInfo">默认关闭。开启才请求麦克风权限，仅在设备上读取音量，不录音、不上传。触摸玩法始终可用。</p><p>按住吹大，松手或轻滑放飞。<br>按住底部滑动扇子。右下送风推向左上，左下送风推向右上；正下托起，松手收风，别碰四周。<br>整颗穿过彩虹圈 +1；碰到圈的两侧或小鸟即破。<br>持续送风向上飞；高度是次指标，彩虹数量单独记最佳。<br>也可用空格吹气，方向键移动扇子。</p></form></dialog><footer>泡泡上云端 <span>UP, UP & AWAY</span></footer></main><script type="module" src="game.mjs"></script></body></html>
