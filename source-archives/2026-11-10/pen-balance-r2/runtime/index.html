<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18372e"><link rel="icon" href="data:,"><title>转笔 R2 · 重力平衡实验</title><link rel="stylesheet" href="style.css"></head><body><main><header><div>最后一排 <small>R2 / 重力平衡实验 · 未发布</small></div><div class="top-actions"><button id="collect">收笔</button><button id="restart">重来</button></div></header><section class="numbers"><div><small>持续时间</small><b id="time">0.0</b><em>秒</em></div><div><small>转速</small><b id="speed">0</b><em>圈 / 秒</em></div><div><small>支撑余量</small><b id="margin">100</b><em>%</em></div></section><p id="mode">未启用传感器 · 请选择输入方式</p><canvas id="scene" aria-label="两个交错支撑接触片上的转笔"></canvas><div id="status">先选倾斜输入，再轻拨一次。</div><section class="panel"><div class="actions"><button id="sensor">启用手机倾斜</button><button id="sim">触控模拟</button><button id="calibrate" disabled>校准持机姿势</button></div><p id="help">传感器只在点击后请求权限。自然持机，再校准为中立。</p><div id="simArea" hidden><div id="tiltpad" aria-label="拖动模拟手机倾斜"><span id="dot"></span><span class="cross">＋</span><small>触控模拟 · 拖动倾斜，松手归零</small></div></div><div id="flick" role="button" tabindex="0" aria-label="向右轻拨笔启动">向右轻拨 → <small>只拨一次，之后靠倾斜保持平衡</small></div><p class="note">两个交错接触片的简化刚体 / 接触模型，不是人体手指完整物理重建。老师保留在场景中，预警规则暂不接入本次机制小样。</p></section></main><script type="module" src="app.js"></script></body></html>
