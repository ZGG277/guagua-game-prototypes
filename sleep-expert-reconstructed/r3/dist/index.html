<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151b24"><title>哄睡专家</title><meta name="description" content="轻摇慢放，等呼气短窗，守住一小觉。"><link rel="stylesheet" href="./style.css"></head><body><main id="shell" class="shell">
<header><h1>哄睡专家 <span>☾</span></h1><nav><button id="music" aria-pressed="true">音乐 开</button><button id="ranking">排行榜</button><span id="ranking-unavailable" class="tiny hidden" role="status"></span><button id="help" class="icon" aria-label="玩法与练习">?</button></nav></header>
<div class="stages"><span id="phase-label">轻摇</span><div id="stage-dots" aria-hidden="true"></div><span id="rest-label"></span></div>
<section class="play-area"><canvas id="scene" width="390" height="530" tabindex="0" aria-label="摇篮到左右顶点时轻点，放下时按住并拖动调平，等呼气短窗口，先抽腿下手再抽头下手，守睡时点击床边预警。"></canvas>
<div id="intro" class="overlay"><div><p class="moon">☾</p><h2>晚安，<br>小祖宗。</h2><button id="start" class="primary" disabled>开始哄睡 <span>→</span></button><p id="boot-status" class="tiny" role="status">准备中…</p></div></div>
<div id="help-overlay" class="overlay hidden"><div><h2>轻一点。</h2><ol><li>摇篮到左右顶点时轻点。</li><li>轻拍：圆点碰到圆环时点一下。</li><li>放下：按住并左右拖动调平。</li><li>抽手：等呼气短窗，按住慢抽。窗外松开，先腿后头。</li><li>守睡：哪里亮起预警，就点哪里。</li></ol><button id="all-sound" class="secondary" aria-pressed="true">全部声音 开</button><button id="resume" class="primary">继续 <span>↗</span></button><div class="practice"><button data-practice="lower">练放下</button><button data-practice="leg">练抽手</button><button data-practice="sleeping">练守睡</button></div><p class="tiny">游戏不作为育儿指导。真实宝宝应仰卧硬床，床内无软物，勿摇晃。</p></div></div>
<div id="ranking-overlay" class="overlay hidden"><div class="ranking-card"><button id="close-ranking" class="close" aria-label="关闭排行榜">×</button><h2>哄睡速度榜</h2><p id="rank-status" role="status"></p><p id="my-rank"></p><ol id="rank-list"></ol><p id="local-fastest" class="tiny"></p></div></div>
<div id="reward-overlay" class="overlay hidden"><div class="reward-card"><div class="medal" aria-hidden="true">☾</div><h2>守住一小觉</h2><p class="tiny">哄到深睡用时</p><p id="result-time" class="result-time"></p><p id="rank-submit-status" class="tiny" role="status"></p><p id="local-save-status" class="tiny" role="status"></p><button id="share" class="primary">分享这份晚安</button><div class="result-actions"><button id="follow">关注作者</button><button id="lights-out">关灯晚安</button></div><button id="result-restart" class="secondary">再哄一次</button><p id="result-status" class="tiny" role="status"></p></div></div>
<div id="lights-overlay" class="overlay dark hidden"><div><p class="moon">☾</p><h2>晚安。</h2><p class="tiny">用小红书右上角关闭。</p><button id="lights-back" class="secondary">返回</button></div></div>
</section>
<section id="controls" class="controls" aria-label="操作区"><div id="rhythm-ui" class="hidden"><canvas id="rhythm-track" width="390" height="112" aria-hidden="true"></canvas><button id="rhythm-pad" aria-label="节奏轻点"><span id="pad-label">顶点轻点</span></button></div><div id="gesture-ui" class="hidden"><button id="gesture-pad" aria-label="按住并拖动"><span id="gesture-icon">↔</span><span id="gesture-label">按住 · 调平</span></button><div class="gesture-copy"><span id="hint"></span><b id="hand-progress"></b></div></div><p id="quiet-hint" class="quiet hidden"></p><p id="feedback" class="feedback" role="status"></p></section>
<footer><span id="record"></span><button id="restart" class="icon" aria-label="重新开始">↻</button></footer></main><script src="./app.js"></script></body></html>
