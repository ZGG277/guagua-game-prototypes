    <style>* { --minitool-row-gap: 0px; --minitool-column-gap: 0px; } html,body{margin:0;background:#f5eee1} .boot-card{box-sizing:border-box;position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;color:#73552c;background:radial-gradient(ellipse at 50% 40%,#fffaf0,#e5dac6);font-family:Georgia,'Songti SC',serif}.boot-card span{font-size:12px;letter-spacing:.25em}.boot-card h1{font-size:24px;font-weight:500;line-height:1.7}.boot-card p{font:14px/1.8 sans-serif;max-width:360px}.boot-card button{min-height:48px;border:1px solid #a98748;border-radius:24px;background:#fff7e7;color:#694b24;padding:10px 26px;font:16px sans-serif}
