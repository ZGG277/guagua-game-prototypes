<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182d2c"><meta name="version" content="R1.1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2715%27 fill=%27%23203b36%27/%3E%3Cpath d=%27M14 45L47 12l5 5-33 33z%27 fill=%27%23d7e3b0%27/%3E%3C/svg%3E"><title>转笔</title><link rel="stylesheet" href="style.css"></head><body><main id="app">
<header><div class="brand">转笔</div><button id="pause" aria-label="暂停游戏">暂停</button></header>
<section class="stats"><div><small>当前</small><strong id="score">0</strong><span>圈</span></div><div class="record"><small>最高</small><b id="best">0</b></div><div class="clock"><small>剩余</small><b id="time">60<span>s</span></b></div></section>
<div class="teacher-status"><span id="teacherText">安心转笔</span><div class="meter"><i id="warning"></i></div></div>
<section id="scene" aria-label="第一视角教室"><canvas id="room"></canvas></section>
<section class="controls"><div id="pad" aria-label="沿圆环画大圈转笔，松手即停"><div class="ring"><span>↻</span></div><svg id="trail" viewBox="0 0 200 200"><path id="trace"/></svg></div></section>
<div id="overlay"><article><h1>转笔</h1><p class="subtitle">沿圆环画大圈，老师回头前松手。</p><button id="start" class="primary">开始</button></article></div>
</main><script type="module" src="app.js"></script></body></html>
