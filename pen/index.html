<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#182d2c"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2715%27 fill=%27%23203b36%27/%3E%3Cpath d=%27M14 45L47 12l5 5-33 33z%27 fill=%27%23d7e3b0%27/%3E%3C/svg%3E"><title>转笔 · 最后一排</title><link rel="stylesheet" href="style.css"></head><body><main id="app">
<header><div class="brand">最后一排 <span>CLASSROOM / R1</span></div><button id="pause" aria-label="暂停游戏">暂停</button></header>
<section class="stats"><div><small>这一局</small><strong id="score">0</strong><span>圈</span></div><div class="record"><small>最高纪录</small><b id="best">0</b></div><div class="clock"><small>下课倒计时</small><b id="time">60<span>s</span></b></div></section>
<div class="teacher-status"><span id="teacherText">老师正在写板书 · 安全</span><div class="meter"><i id="warning"></i></div></div>
<section id="scene" aria-label="第一视角教室"><canvas id="room"></canvas><div id="notice" aria-live="polite"></div><div id="chalkHint"></div><div class="desk-tag">三年二班 / 靠窗最后一排</div></section>
<section class="controls"><div class="control-title"><span>画大圈转笔</span><small>松手立刻停 · 红灯别转</small></div><div class="touch-row"><button class="dodge" id="left" aria-label="向左躲粉笔">←<small>左闪</small></button><div id="pad" aria-label="沿圆环画圈转笔"><div class="ring"><span>↻</span><small>沿圆环画圈</small></div><svg id="trail" viewBox="0 0 200 200"><path id="trace"/></svg></div><button class="dodge" id="right" aria-label="向右躲粉笔">→<small>右闪</small></button></div><p class="hint">粉笔来了 → 点左 / 右闪避　·　命中扣 5 圈</p></section>
<div id="overlay"><article><div class="eyebrow">60 秒的课间，藏在课堂里</div><h1>转<span>笔</span></h1><p class="subtitle">老师的背影，是你的舞台。</p><div class="instructions"><p><b>01</b> 在下方圆环画大圈，每转一圈 +1</p><p><b>02</b> 黄灯准备松手，红灯回头约 1 秒</p><p><b>03</b> 粉笔飞来，点左右按钮或横滑闪开</p></div><p class="fine">回头时还在转 → 立即结算<br>太小的圈不算 · 被粉笔砸中 −5，最低 0</p><button id="start" class="primary">坐好，开始转笔 <span>↗</span></button><small class="bottom-note">单手可玩 / 无需登录 / 最高纪录保存在本机</small></article></div>
</main><script type="module" src="app.js"></script></body></html>
